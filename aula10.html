<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Organizador de Tarefas</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    input {
      padding: 10px;
      width: 250px;
    }

    button {
      padding: 10px;
      margin-left: 5px;
      cursor: pointer;
    }

    ul {
      margin-top: 20px;
      padding: 0;
    }

    li {
      list-style: none;
      background: white;
      margin-bottom: 10px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 5px;
    }

    .concluida {
      text-decoration: line-through;
      color: gray;
    }

    .remover {
      background: red;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

  <h2>Organizador de Tarefas</h2>

  <input type="text" id="tarefaInput" placeholder="Digite uma tarefa">
  <button id="addBtn">Adicionar Tarefa</button>

  <ul id="listaTarefas"></ul>

  <script>
    const input = document.getElementById("tarefaInput");
    const addBtn = document.getElementById("addBtn");
    const lista = document.getElementById("listaTarefas");

   
    addBtn.addEventListener("click", () => {

      const texto = input.value.trim();

      if (texto === "") return;

      const li = document.createElement("li");

      li.innerHTML = `
        <span class="texto">${texto}</span>
        <button class="remover">Remover</button>
      `;

      
      li.addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON") {
          li.classList.toggle("concluida");
        }
      });

      li.querySelector(".remover").addEventListener("click", (e) => {
        e.stopPropagation(); // evita marcar como concluída
        lista.removeChild(li);
      });

      lista.appendChild(li);
      input.value = "";
    });
  </script>

</body>
</html>
